[project]
name = "scoringmodel"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "matplotlib>=3.7",
    "seaborn>=0.13",
    "ipykernel>=6.0",
    "notebook>=7.0",
    "shap==0.54.1",
    "lime==0.2.0.1",
]

[project.scripts]
scoringmodel = "scoringmodel:main"

[build-system]
requires = ["uv_build>=0.13.1,<0.14.0"]
build-backend = "uv_build"
